AWSTemplateFormatVersion: '2010-09-09'
Description: RecallOps self-contained authenticated public judge demo

Parameters:
  ImageUri:
    Type: String
    AllowedPattern: '^.+@sha256:[a-f0-9]{64}$'
  DatabaseUrlSecretArn: { Type: String, NoEcho: true }
  VpcId: { Type: 'AWS::EC2::VPC::Id' }
  TaskSubnetIds: { Type: 'List<AWS::EC2::Subnet::Id>' }
  OriginAvailabilityZoneA: { Type: 'AWS::EC2::AvailabilityZone::Name' }
  OriginAvailabilityZoneB: { Type: 'AWS::EC2::AvailabilityZone::Name' }
  OriginSubnetCidrA: { Type: String, Default: 172.31.240.0/28 }
  OriginSubnetCidrB: { Type: String, Default: 172.31.240.16/28 }
  BedrockModelId: { Type: String, Default: amazon.nova-lite-v1:0 }
  BedrockEmbeddingModelId: { Type: String, Default: amazon.titan-embed-text-v2:0 }
  BedrockModelArns: { Type: CommaDelimitedList }
  DesiredCount: { Type: Number, Default: 1, MinValue: 1, MaxValue: 3 }
  JudgeOperatorEmail: { Type: String, Default: recallops.operator@example.com }
  JudgeReviewerEmail: { Type: String, Default: recallops.reviewer@example.com }

Resources:
  OriginSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      AvailabilityZone: !Ref OriginAvailabilityZoneA
      CidrBlock: !Ref OriginSubnetCidrA
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-origin-a' }]
  OriginSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      AvailabilityZone: !Ref OriginAvailabilityZoneB
      CidrBlock: !Ref OriginSubnetCidrB
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-origin-b' }]

  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: archive-old-versions
            Status: Enabled
            NoncurrentVersionTransitions:
              - { StorageClass: STANDARD_IA, TransitionInDays: 30 }
            NoncurrentVersionExpiration: { NoncurrentDays: 365 }
  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt EvidenceBucket.Arn, !Sub '${EvidenceBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  TokenClaimsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-token-claims'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-token-claims:*'
  TokenClaimsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-token-claims'
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt TokenClaimsFunctionRole.Arn
      Timeout: 5
      MemorySize: 128
      Code:
        ZipFile: |
          def handler(event, context):
              del context
              tenant = event.get("request", {}).get("userAttributes", {}).get("custom:tenant_id")
              if not tenant:
                  raise ValueError("custom:tenant_id is required")
              event["response"] = {"claimsAndScopeOverrideDetails": {"accessTokenGeneration": {"claimsToAddOrOverride": {"tenant_id": tenant}}}}
              return event
  TokenClaimsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TokenClaimsFunction
      Principal: cognito-idp.amazonaws.com

  UserPool:
    Type: AWS::Cognito::UserPool
    DependsOn: TokenClaimsPermission
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-judges'
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      DeletionProtection: INACTIVE
      MfaConfiguration: 'OFF'
      Schema:
        - Name: tenant_id
          AttributeDataType: String
          Mutable: false
          Required: false
          StringAttributeConstraints: { MinLength: '1', MaxLength: '80' }
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 1
      LambdaConfig:
        PreTokenGeneration: !GetAtt TokenClaimsFunction.Arn
        PreTokenGenerationConfig:
          LambdaArn: !GetAtt TokenClaimsFunction.Arn
          LambdaVersion: V2_0
  OperatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: operator, UserPoolId: !Ref UserPool, Precedence: 10 }
  ReviewerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: reviewer, UserPoolId: !Ref UserPool, Precedence: 10 }
  JudgeProvisionerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-judge-provisioner'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: provision-judges
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminAddUserToGroup
                Resource: !GetAtt UserPool.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/judge/*'
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-judge-provisioner:*'
  JudgeProvisionerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-judge-provisioner'
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt JudgeProvisionerRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import secrets
          import string
          import urllib.request
          import boto3

          cognito = boto3.client("cognito-idp")
          secret_store = boto3.client("secretsmanager")

          def generated_password():
              characters = [secrets.choice(string.ascii_lowercase), secrets.choice(string.ascii_uppercase), secrets.choice(string.digits), secrets.choice("!@#$%^&*()-_=+")]
              characters.extend(secrets.choice(string.ascii_letters + string.digits + "!@#$%^&*()-_=+") for _ in range(20))
              secrets.SystemRandom().shuffle(characters)
              return "".join(characters)

          def credential(secret_name, username):
              try:
                  current = json.loads(secret_store.get_secret_value(SecretId=secret_name)["SecretString"])
              except secret_store.exceptions.ResourceNotFoundException:
                  current = {}
              password = current.get("password") or generated_password()
              if current.get("email") != username or "password" not in current:
                  value = json.dumps({"email": username, "password": password})
                  if current:
                      secret_store.put_secret_value(SecretId=secret_name, SecretString=value)
                  else:
                      secret_store.create_secret(Name=secret_name, Description="RecallOps generated judge credential", SecretString=value)
              return password

          def respond(event, context, status, reason=None):
              body = json.dumps({"Status": status, "Reason": reason or "complete", "PhysicalResourceId": event.get("PhysicalResourceId", event["ResourceProperties"]["Username"]), "StackId": event["StackId"], "RequestId": event["RequestId"], "LogicalResourceId": event["LogicalResourceId"], "NoEcho": True})
              request = urllib.request.Request(event["ResponseURL"], data=body.encode(), method="PUT", headers={"content-type": "", "content-length": str(len(body))})
              urllib.request.urlopen(request, timeout=10)

          def handler(event, context):
              properties = event["ResourceProperties"]
              pool = properties["UserPoolId"]
              username = properties["Username"]
              try:
                  if event["RequestType"] == "Delete":
                      try:
                          cognito.admin_delete_user(UserPoolId=pool, Username=username)
                      except cognito.exceptions.UserNotFoundException:
                          pass
                      try:
                          secret_store.delete_secret(SecretId=properties["CredentialSecretName"], ForceDeleteWithoutRecovery=True)
                      except secret_store.exceptions.ResourceNotFoundException:
                          pass
                  else:
                      password = credential(properties["CredentialSecretName"], username)
                      attributes = [{"Name": "email", "Value": username}, {"Name": "email_verified", "Value": "true"}, {"Name": "custom:tenant_id", "Value": properties["TenantId"]}]
                      try:
                          cognito.admin_create_user(UserPoolId=pool, Username=username, UserAttributes=attributes, MessageAction="SUPPRESS")
                      except cognito.exceptions.UsernameExistsException:
                          pass
                      cognito.admin_set_user_password(UserPoolId=pool, Username=username, Password=password, Permanent=True)
                      cognito.admin_add_user_to_group(UserPoolId=pool, Username=username, GroupName=properties["Group"])
                  respond(event, context, "SUCCESS")
              except Exception as error:
                  respond(event, context, "FAILED", str(error))
  JudgeOperator:
    Type: Custom::RecallOpsJudge
    DependsOn: OperatorGroup
    Properties:
      ServiceToken: !GetAtt JudgeProvisionerFunction.Arn
      UserPoolId: !Ref UserPool
      Username: !Ref JudgeOperatorEmail
      CredentialSecretName: !Sub '${AWS::StackName}/judge/operator'
      Group: operator
      TenantId: demo
  JudgeReviewer:
    Type: Custom::RecallOpsJudge
    DependsOn: ReviewerGroup
    Properties:
      ServiceToken: !GetAtt JudgeProvisionerFunction.Arn
      UserPoolId: !Ref UserPool
      Username: !Ref JudgeReviewerEmail
      CredentialSecretName: !Sub '${AWS::StackName}/judge/reviewer'
      Group: reviewer
      TenantId: demo
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'recallops-${AWS::AccountId}-${AWS::Region}'
      UserPoolId: !Ref UserPool

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-cluster'
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: 30
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken]
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/recallops'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseUrlSecretArn
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref BedrockModelArns
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${EvidenceBucket.Arn}/tenants/*'

  VpcLinkSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API Gateway VPC Link egress
      VpcId: !Ref VpcId
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudFront VPC origin ingress
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref VpcLinkSecurityGroup
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RecallOps tasks accept only ALB traffic
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Type: application
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: [!Ref OriginSubnetA, !Ref OriginSubnetB]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        - { Key: deletion_protection.enabled, Value: 'false' }
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}'
      RetentionInDays: 30
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: false
  ApiVpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: !Sub '${AWS::StackName}-link'
      SecurityGroupIds: [!Ref VpcLinkSecurityGroup]
      SubnetIds: [!Ref OriginSubnetA, !Ref OriginSubnetB]
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    DependsOn: HttpListener
    Properties:
      ApiId: !Ref Api
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Ref HttpListener
      ConnectionType: VPC_LINK
      ConnectionId: !Ref ApiVpcLink
      PayloadFormatVersion: '1.0'
  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: '$default'
      Target: !Join ['/', [integrations, !Ref ApiIntegration]]
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency"}'

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${AWS::StackName}-browser'
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/']
      LogoutURLs: [!Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/']
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      TokenValidityUnits: { AccessToken: hours }

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-api'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          Command: [sh, -c, 'recallops-migrate && exec uvicorn recallops.main:app --host 0.0.0.0 --port 8080']
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          Secrets:
            - { Name: RECALLOPS_DATABASE_URL, ValueFrom: !Ref DatabaseUrlSecretArn }
          Environment:
            - { Name: RECALLOPS_STORE, Value: postgres }
            - { Name: RECALLOPS_REASONING_PROVIDER, Value: bedrock }
            - { Name: RECALLOPS_EMBEDDING_PROVIDER, Value: bedrock }
            - { Name: RECALLOPS_AUTH_MODE, Value: oidc }
            - { Name: RECALLOPS_OIDC_TENANT_CLAIM, Value: tenant_id }
            - { Name: RECALLOPS_OIDC_ROLES_CLAIM, Value: 'cognito:groups' }
            - { Name: RECALLOPS_AWS_REGION, Value: !Ref 'AWS::Region' }
            - { Name: RECALLOPS_BEDROCK_MODEL_ID, Value: !Ref BedrockModelId }
            - { Name: RECALLOPS_BEDROCK_EMBEDDING_MODEL_ID, Value: !Ref BedrockEmbeddingModelId }
            - { Name: RECALLOPS_OIDC_ISSUER, Value: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}' }
            - { Name: RECALLOPS_OIDC_AUDIENCE, Value: !Ref UserPoolClient }
            - { Name: RECALLOPS_OIDC_AUTHORIZATION_URL, Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize' }
            - { Name: RECALLOPS_OIDC_TOKEN_URL, Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token' }
            - { Name: RECALLOPS_OIDC_LOGOUT_URL, Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/logout' }
            - { Name: RECALLOPS_OIDC_REDIRECT_URL, Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/' }
            - { Name: RECALLOPS_EVIDENCE_BUCKET, Value: !Ref EvidenceBucket }
          HealthCheck:
            Command: [CMD-SHELL, "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)\""]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 90
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: api
  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub '${AWS::StackName}-api'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: !Ref TaskSubnetIds
      LoadBalancers:
        - { ContainerName: api, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup }
  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: RecallOps sustained high CPU
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - { Name: ClusterName, Value: !Ref Cluster }
        - { Name: ServiceName, Value: !GetAtt Service.Name }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: RecallOps target errors
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ServiceUrl: { Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}' }
  ApiId: { Value: !Ref Api }
  ClusterName: { Value: !Ref Cluster }
  ServiceName: { Value: !GetAtt Service.Name }
  UserPoolId: { Value: !Ref UserPool }
  UserPoolClientId: { Value: !Ref UserPoolClient }
  EvidenceBucketName: { Value: !Ref EvidenceBucket }
