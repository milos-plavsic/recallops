AWSTemplateFormatVersion: '2010-09-09'
Description: RecallOps no-signup judge deployment with capability-separated ECS tasks

Parameters:
  BuildSha:
    Type: String
    AllowedPattern: '^[a-f0-9]{40}$'
  ImageDigest:
    Type: String
    AllowedPattern: '^sha256:[a-f0-9]{64}$'
  ImageUri:
    Type: String
    AllowedPattern: '^.+@sha256:[a-f0-9]{64}$'
  ReleaseId:
    Type: String
    MinLength: 3
    MaxLength: 100
    AllowedPattern: '^[A-Za-z0-9._-]+$'
  ReceiptKeyThumbprint:
    Type: String
    MinLength: 43
    MaxLength: 43
    AllowedPattern: '^[A-Za-z0-9_-]{43}$'
  TrustedKeysJson:
    Type: String
    MinLength: 64
    MaxLength: 4096
  ReleaseArtifactsManifestJson:
    Type: String
    MinLength: 64
    MaxLength: 4096
  ReleaseArtifactsPrefix:
    Type: String
    AllowedPattern: '^releases/[A-Za-z0-9._/-]+$'
  DatabaseUrlSecretArn:
    Type: String
    NoEcho: true
    AllowedPattern: '^arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
  OutboxDatabaseUrlSecretArn:
    Type: String
    NoEcho: true
    AllowedPattern: '^arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
  ReceiptDatabaseUrlSecretArn:
    Type: String
    NoEcho: true
    AllowedPattern: '^arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
  MigrationDatabaseUrlSecretArn:
    Type: String
    NoEcho: true
    AllowedPattern: '^arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
  JudgeRateLimitSecretArn:
    Type: String
    NoEcho: true
    AllowedPattern: '^arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
  ReceiptPseudonymSecretArn:
    Type: String
    NoEcho: true
    AllowedPattern: '^arn:aws[a-zA-Z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
  ReceiptSigningKeyArn:
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]+$'
  EvidenceEncryptionKeyArn:
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]+$'
  EvidenceBucketName:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  DesiredApiCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 2
  DesiredOutboxCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1
    Description: Legacy evidence delivery is outside the judge path and remains stopped by default.
  DesiredReceiptCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1
    Description: Enable only after the one-shot migration task succeeds.
  AlarmTopicArn:
    Type: String
    Default: ''

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-cluster'
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
      Tags:
        - { Key: Application, Value: RecallOps }

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}/api'
      RetentionInDays: 14
  OutboxLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}/outbox'
      RetentionInDays: 14
  ReceiptLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}/receipt'
      RetentionInDays: 14
  MigrationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}/migration'
      RetentionInDays: 14
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}'
      RetentionInDays: 14

  ApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-api-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: api-task-startup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              -
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              -
                Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/recallops'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${ApiLogGroup.Arn}:*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DatabaseUrlSecretArn, !Ref JudgeRateLimitSecretArn]

  OutboxExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-outbox-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: outbox-task-startup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/recallops'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${OutboxLogGroup.Arn}:*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref OutboxDatabaseUrlSecretArn

  ReceiptExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-receipt-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: receipt-task-startup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/recallops'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${ReceiptLogGroup.Arn}:*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref ReceiptDatabaseUrlSecretArn, !Ref ReceiptPseudonymSecretArn]

  MigrationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-migration-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: migration-task-startup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/recallops'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${MigrationLogGroup.Arn}:*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref MigrationDatabaseUrlSecretArn

  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-api-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: finalized-public-bundle-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObjectVersion, s3:GetObjectVersionAttributes]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${EvidenceBucketName}/synthetic-authority-bundles/*'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref EvidenceEncryptionKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 's3.${AWS::Region}.${AWS::URLSuffix}'

  OutboxTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-outbox-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: bounded-legacy-evidence-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${EvidenceBucketName}/tenants/*'
              - Effect: Allow
                Action: [kms:Encrypt, kms:GenerateDataKey]
                Resource: !Ref EvidenceEncryptionKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 's3.${AWS::Region}.${AWS::URLSuffix}'

  ReceiptTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-receipt-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: exact-receipt-signing
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: kms:GetPublicKey
                Resource: !Ref ReceiptSigningKeyArn
              - Effect: Allow
                Action: kms:Sign
                Resource: !Ref ReceiptSigningKeyArn
                Condition:
                  StringEquals:
                    kms:SigningAlgorithm: ED25519_SHA_512
        - PolicyName: pinned-release-read-and-bundle-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObjectVersion, s3:GetObjectVersionAttributes]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${EvidenceBucketName}/${ReleaseArtifactsPrefix}/*'
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${EvidenceBucketName}/synthetic-authority-bundles/*'
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
                Resource: !Ref EvidenceEncryptionKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 's3.${AWS::Region}.${AWS::URLSuffix}'

  MigrationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-migration-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RecallOps internal ALB receives only API Gateway VPC Link traffic
      VpcId: !Ref VpcId
      Tags:
        - { Key: Application, Value: RecallOps }

  VpcLinkSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RecallOps API Gateway VPC Link egress
      VpcId: !Ref VpcId
      SecurityGroupEgress: []
      Tags:
        - { Key: Application, Value: RecallOps }

  VpcLinkToLoadBalancerEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref VpcLinkSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      DestinationSecurityGroupId: !Ref LoadBalancerSecurityGroup

  LoadBalancerFromVpcLinkIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref LoadBalancerSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref VpcLinkSecurityGroup

  ApiTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RecallOps API task ingress only from internal ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      Tags:
        - { Key: Application, Value: RecallOps }

  WorkerTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RecallOps worker tasks have no ingress
      VpcId: !Ref VpcId
      Tags:
        - { Key: Application, Value: RecallOps }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Type: application
      IpAddressType: ipv4
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: !Ref PublicSubnetIds
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        - { Key: routing.http.desync_mitigation_mode, Value: defensive }
        - { Key: routing.http.x_amzn_tls_version_and_cipher_suite.enabled, Value: 'true' }
        - { Key: deletion_protection.enabled, Value: 'false' }
        - { Key: idle_timeout.timeout_seconds, Value: '60' }
      Tags:
        - { Key: Application, Value: RecallOps }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      ProtocolVersion: HTTP1
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '20' }
      Tags:
        - { Key: Application, Value: RecallOps }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${AWS::StackName}-regional'
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${AWS::StackName}-web-acl'
        SampledRequestsEnabled: false
      Rules:
        - Name: rate-limit
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              EvaluationWindowSec: 300
              Limit: 500
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${AWS::StackName}-rate-limit'
            SampledRequestsEnabled: false
        - Name: aws-common-rule-set
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${AWS::StackName}-common-rules'
            SampledRequestsEnabled: false

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt WebAcl.Arn

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: false

  ApiVpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: !Sub '${AWS::StackName}-link'
      SecurityGroupIds: [!Ref VpcLinkSecurityGroup]
      SubnetIds: !Ref PublicSubnetIds
      Tags:
        Application: RecallOps

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Ref HttpListener
      ConnectionType: VPC_LINK
      ConnectionId: !Ref ApiVpcLink
      PayloadFormatVersion: '1.0'
      TimeoutInMillis: 30000

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: '$default'
      Target: !Join ['/', [integrations, !Ref ApiIntegration]]

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency"}'

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-api'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ApiExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          User: '65532'
          LinuxParameters:
            Capabilities: { Drop: [ALL] }
            InitProcessEnabled: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Secrets:
            - Name: RECALLOPS_DATABASE_URL
              ValueFrom: !Ref DatabaseUrlSecretArn
            - Name: RECALLOPS_JUDGE_RATE_LIMIT_KEY
              ValueFrom: !Ref JudgeRateLimitSecretArn
          Environment:
            - { Name: RECALLOPS_STORE, Value: postgres }
            - { Name: RECALLOPS_AUTH_MODE, Value: judge }
            - { Name: RECALLOPS_JUDGE_COOKIE_SECURE, Value: 'true' }
            - { Name: RECALLOPS_REASONING_PROVIDER, Value: deterministic }
            - { Name: RECALLOPS_EMBEDDING_PROVIDER, Value: deterministic }
            - { Name: RECALLOPS_DIAGNOSTIC_PROVIDER, Value: none }
            - Name: RECALLOPS_PUBLIC_ORIGIN
              Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            - { Name: RECALLOPS_BUILD_SHA, Value: !Ref BuildSha }
            - { Name: RECALLOPS_RELEASE_IMAGE_DIGEST, Value: !Ref ImageDigest }
            - { Name: RECALLOPS_RECEIPT_RELEASE_ID, Value: !Ref ReleaseId }
            - { Name: RECALLOPS_RECEIPT_TRUSTED_KEYS_JSON, Value: !Ref TrustedKeysJson }
            - { Name: RECALLOPS_AUTHORITY_BUNDLE_BUCKET, Value: !Ref EvidenceBucketName }
            - { Name: RECALLOPS_AUTHORITY_BUNDLE_KMS_KEY_ID, Value: !Ref EvidenceEncryptionKeyArn }
            - { Name: RECALLOPS_EVALUATION_VERSION, Value: governed-benchmark-v1 }
            - { Name: RECALLOPS_CAPABILITY_POLICY_VERSION, Value: webmcp-capability-v1 }
            - { Name: RECALLOPS_RECEIPT_POLICY_VERSION, Value: authority-receipt-policy-v1 }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
          StopTimeout: 30
      Tags:
        - { Key: Application, Value: RecallOps }
        - { Key: ReleaseId, Value: !Ref ReleaseId }

  OutboxTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-outbox'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt OutboxExecutionRole.Arn
      TaskRoleArn: !GetAtt OutboxTaskRole.Arn
      ContainerDefinitions:
        - Name: outbox
          Image: !Ref ImageUri
          Essential: true
          Command: [recallops-outbox, --watch, --poll-seconds, '5']
          ReadonlyRootFilesystem: true
          User: '65532'
          LinuxParameters:
            Capabilities: { Drop: [ALL] }
            InitProcessEnabled: true
          Secrets:
            - Name: RECALLOPS_DATABASE_URL
              ValueFrom: !Ref OutboxDatabaseUrlSecretArn
          Environment:
            - { Name: RECALLOPS_EVIDENCE_BUCKET, Value: !Ref EvidenceBucketName }
            - { Name: RECALLOPS_EVIDENCE_KMS_KEY_ID, Value: !Ref EvidenceEncryptionKeyArn }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref OutboxLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: outbox
          StopTimeout: 30
      Tags:
        - { Key: Application, Value: RecallOps }
        - { Key: ReleaseId, Value: !Ref ReleaseId }

  ReceiptTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-receipt'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ReceiptExecutionRole.Arn
      TaskRoleArn: !GetAtt ReceiptTaskRole.Arn
      ContainerDefinitions:
        - Name: receipt
          Image: !Ref ImageUri
          Essential: true
          Command: [recallops-receipt-worker, --watch, --poll-seconds, '2']
          ReadonlyRootFilesystem: true
          User: '65532'
          LinuxParameters:
            Capabilities: { Drop: [ALL] }
            InitProcessEnabled: true
          Secrets:
            - Name: RECALLOPS_DATABASE_URL
              ValueFrom: !Ref ReceiptDatabaseUrlSecretArn
            - Name: RECALLOPS_RECEIPT_SUBJECT_PSEUDONYM_KEY_B64
              ValueFrom: !Ref ReceiptPseudonymSecretArn
          Environment:
            - { Name: RECALLOPS_AWS_REGION, Value: !Ref AWS::Region }
            - { Name: RECALLOPS_BUILD_SHA, Value: !Ref BuildSha }
            - { Name: RECALLOPS_RELEASE_IMAGE_DIGEST, Value: !Ref ImageDigest }
            - { Name: RECALLOPS_RECEIPT_RELEASE_ID, Value: !Ref ReleaseId }
            - { Name: RECALLOPS_RECEIPT_KMS_KEY_ID, Value: !Ref ReceiptSigningKeyArn }
            - { Name: RECALLOPS_RECEIPT_TRUSTED_KEYS_JSON, Value: !Ref TrustedKeysJson }
            - { Name: RECALLOPS_RECEIPT_RELEASE_ARTIFACTS_BUCKET, Value: !Ref EvidenceBucketName }
            - { Name: RECALLOPS_RECEIPT_RELEASE_ARTIFACTS_PREFIX, Value: !Ref ReleaseArtifactsPrefix }
            - { Name: RECALLOPS_RECEIPT_RELEASE_ARTIFACTS_MANIFEST_JSON, Value: !Ref ReleaseArtifactsManifestJson }
            - { Name: RECALLOPS_AUTHORITY_BUNDLE_BUCKET, Value: !Ref EvidenceBucketName }
            - { Name: RECALLOPS_AUTHORITY_BUNDLE_KMS_KEY_ID, Value: !Ref EvidenceEncryptionKeyArn }
            - { Name: RECALLOPS_EVALUATION_VERSION, Value: governed-benchmark-v1 }
            - { Name: RECALLOPS_CAPABILITY_POLICY_VERSION, Value: webmcp-capability-v1 }
            - { Name: RECALLOPS_RECEIPT_POLICY_VERSION, Value: authority-receipt-policy-v1 }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ReceiptLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: receipt
          StopTimeout: 30
      Tags:
        - { Key: Application, Value: RecallOps }
        - { Key: ReleaseId, Value: !Ref ReleaseId }

  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-migration'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt MigrationExecutionRole.Arn
      TaskRoleArn: !GetAtt MigrationTaskRole.Arn
      ContainerDefinitions:
        - Name: migration
          Image: !Ref ImageUri
          Essential: true
          Command: [recallops-migrate]
          ReadonlyRootFilesystem: true
          User: '65532'
          LinuxParameters:
            Capabilities: { Drop: [ALL] }
            InitProcessEnabled: true
          Secrets:
            - Name: RECALLOPS_DATABASE_URL
              ValueFrom: !Ref MigrationDatabaseUrlSecretArn
          Environment:
            - { Name: RECALLOPS_BUILD_SHA, Value: !Ref BuildSha }
            - { Name: RECALLOPS_RELEASE_IMAGE_DIGEST, Value: !Ref ImageDigest }
            - { Name: RECALLOPS_RECEIPT_RELEASE_ID, Value: !Ref ReleaseId }
            - { Name: RECALLOPS_RECEIPT_KEY_THUMBPRINT, Value: !Ref ReceiptKeyThumbprint }
            - { Name: RECALLOPS_EVALUATION_VERSION, Value: governed-benchmark-v1 }
            - { Name: RECALLOPS_CAPABILITY_POLICY_VERSION, Value: webmcp-capability-v1 }
            - { Name: RECALLOPS_RECEIPT_POLICY_VERSION, Value: authority-receipt-policy-v1 }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MigrationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migration
          StopTimeout: 30
      Tags:
        - { Key: Application, Value: RecallOps }
        - { Key: ReleaseId, Value: !Ref ReleaseId }

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: [HttpListener, WebAclAssociation]
    Properties:
      ServiceName: !Sub '${AWS::StackName}-api'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !Ref DesiredApiCount
      LaunchType: FARGATE
      PlatformVersion: 1.4.0
      EnableECSManagedTags: true
      EnableExecuteCommand: false
      PropagateTags: TASK_DEFINITION
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      HealthCheckGracePeriodSeconds: 60
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref ApiTaskSecurityGroup]
          Subnets: !Ref PublicSubnetIds
      Tags:
        - { Key: Application, Value: RecallOps }
        - { Key: ReleaseId, Value: !Ref ReleaseId }

  OutboxService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${AWS::StackName}-outbox'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref OutboxTaskDefinition
      DesiredCount: !Ref DesiredOutboxCount
      LaunchType: FARGATE
      PlatformVersion: 1.4.0
      EnableECSManagedTags: true
      EnableExecuteCommand: false
      PropagateTags: TASK_DEFINITION
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref WorkerTaskSecurityGroup]
          Subnets: !Ref PublicSubnetIds
      Tags:
        - { Key: Application, Value: RecallOps }
        - { Key: ReleaseId, Value: !Ref ReleaseId }

  ReceiptService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${AWS::StackName}-receipt'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ReceiptTaskDefinition
      DesiredCount: !Ref DesiredReceiptCount
      LaunchType: FARGATE
      PlatformVersion: 1.4.0
      EnableECSManagedTags: true
      EnableExecuteCommand: false
      PropagateTags: TASK_DEFINITION
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref WorkerTaskSecurityGroup]
          Subnets: !Ref PublicSubnetIds
      Tags:
        - { Key: Application, Value: RecallOps }
        - { Key: ReleaseId, Value: !Ref ReleaseId }

  HealthyTargetCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-healthy-target-shortfall'
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref DesiredApiCount
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  UnhealthyTargetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-unhealthy-targets'
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-target-5xx'
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

Outputs:
  PublicUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  ClusterName:
    Value: !Ref Cluster
  ApiServiceName:
    Value: !GetAtt ApiService.Name
  OutboxServiceName:
    Value: !GetAtt OutboxService.Name
  ReceiptServiceName:
    Value: !GetAtt ReceiptService.Name
  MigrationTaskDefinitionArn:
    Value: !Ref MigrationTaskDefinition
  WorkerTaskSecurityGroupId:
    Value: !Ref WorkerTaskSecurityGroup
  ApiTaskSecurityGroupId:
    Value: !Ref ApiTaskSecurityGroup
  PublicSubnetIds:
    Value: !Join [',', !Ref PublicSubnetIds]
  ReleaseIdentity:
    Value: !Sub '${ReleaseId}:${BuildSha}:${ImageDigest}:${ReceiptKeyThumbprint}'
