AWSTemplateFormatVersion: '2010-09-09'
Description: RecallOps secure, observable AWS runtime

Parameters:
  ImageUri:
    Type: String
    AllowedPattern: '^.+@sha256:[a-f0-9]{64}$'
    ConstraintDescription: Use an immutable container image digest.
  DatabaseUrlSecretArn: { Type: String, NoEcho: true }
  VpcId: { Type: 'AWS::EC2::VPC::Id' }
  PublicSubnetIds: { Type: 'List<AWS::EC2::Subnet::Id>' }
  PrivateSubnetIds: { Type: 'List<AWS::EC2::Subnet::Id>' }
  CertificateArn: { Type: String }
  PublicHostname:
    Type: String
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$'
  OidcIssuer: { Type: String, AllowedPattern: '^https://[^/]+.*$' }
  OidcAudience: { Type: String, MinLength: 1 }
  BedrockModelId: { Type: String, Default: amazon.nova-lite-v1:0 }
  BedrockEmbeddingModelId: { Type: String, Default: amazon.titan-embed-text-v2:0 }
  BedrockModelArns:
    Type: CommaDelimitedList
    Description: Exact foundation-model and inference-profile ARNs the task may invoke.
  DesiredCount: { Type: Number, Default: 1, MinValue: 1, MaxValue: 10 }
  RateLimitPerFiveMinutes: { Type: Number, Default: 1000, MinValue: 100, MaxValue: 20000000 }

Resources:
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: archive-old-versions
            Status: Enabled
            NoncurrentVersionTransitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
            NoncurrentVersionExpiration: { NoncurrentDays: 365 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: deny-insecure-transport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt EvidenceBucket.Arn, !Sub '${EvidenceBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-cluster'
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: database-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseUrlSecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeApprovedModels
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref BedrockModelArns
              - Sid: WriteTenantEvidence
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${EvidenceBucket.Arn}/tenants/*'

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-api'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          Command: [sh, -c, 'recallops-migrate && exec uvicorn recallops.main:app --host 0.0.0.0 --port 8080']
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          Secrets:
            - Name: RECALLOPS_DATABASE_URL
              ValueFrom: !Ref DatabaseUrlSecretArn
          Environment:
            - { Name: RECALLOPS_STORE, Value: postgres }
            - { Name: RECALLOPS_REASONING_PROVIDER, Value: bedrock }
            - { Name: RECALLOPS_EMBEDDING_PROVIDER, Value: bedrock }
            - { Name: RECALLOPS_AUTH_MODE, Value: oidc }
            - { Name: RECALLOPS_OIDC_TENANT_CLAIM, Value: 'custom:tenant_id' }
            - { Name: RECALLOPS_OIDC_ROLES_CLAIM, Value: 'cognito:groups' }
            - { Name: RECALLOPS_AWS_REGION, Value: !Ref AWS::Region }
            - { Name: RECALLOPS_BEDROCK_MODEL_ID, Value: !Ref BedrockModelId }
            - { Name: RECALLOPS_BEDROCK_EMBEDDING_MODEL_ID, Value: !Ref BedrockEmbeddingModelId }
            - Name: RECALLOPS_OIDC_ISSUER
              Value: !Ref OidcIssuer
            - Name: RECALLOPS_OIDC_AUDIENCE
              Value: !Ref OidcAudience
            - Name: RECALLOPS_EVIDENCE_BUCKET
              Value: !Ref EvidenceBucket
          HealthCheck:
            Command: [CMD-SHELL, "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)\""]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS ingress to RecallOps
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RecallOps tasks accept only load balancer traffic
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: !Ref PublicSubnetIds
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        - { Key: routing.http.xff_client_port.enabled, Value: 'true' }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      ProtocolVersion: HTTP1
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${AWS::StackName}-web-acl'
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${AWS::StackName}-waf'
        SampledRequestsEnabled: true
      Rules:
        - Name: ip-rate-limit
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: !Ref RateLimitPerFiveMinutes
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: ip-rate-limit
            SampledRequestsEnabled: true

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties: { ResourceArn: !Ref LoadBalancer, WebACLArn: !GetAtt WebAcl.Arn }

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: !Sub '${AWS::StackName}-api'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: !Ref PrivateSubnetIds
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: RecallOps sustained high CPU
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - { Name: ClusterName, Value: !Ref Cluster }
        - { Name: ServiceName, Value: !GetAtt Service.Name }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: RecallOps target errors
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ClusterName: { Value: !Ref Cluster }
  ServiceName: { Value: !GetAtt Service.Name }
  TaskDefinitionArn: { Value: !Ref TaskDefinition }
  TaskSecurityGroupId: { Value: !Ref TaskSecurityGroup }
  EvidenceBucketName: { Value: !Ref EvidenceBucket }
  LoadBalancerDnsName: { Value: !GetAtt LoadBalancer.DNSName }
  ServiceUrl: { Value: !Sub 'https://${PublicHostname}' }
