[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "recallops"
version = "0.1.0"
description = "Outcome-conditioned incident memory for safe AI operations"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.140.13,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.14.2,<3",
  "PyJWT[crypto]>=2.13.0,<3",
  "structlog>=26.1.0,<27",
  "uvicorn[standard]>=0.52.0,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
recallops = "recallops.main:run"
recallops-eval = "recallops.evaluation:main"
recallops-migrate = "recallops.migrate:main"
recallops-reembed = "recallops.reembed:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recallops"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["recallops"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
