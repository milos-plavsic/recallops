[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "recallops"
version = "0.1.0"
description = "Outcome-conditioned incident memory for safe AI operations"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.140.13,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.14.2,<3",
  "PyJWT[crypto]>=2.13.0,<3",
  "structlog>=26.1.0,<27",
  "uvicorn[standard]>=0.52.0,<1",
]

[project.optional-dependencies]
dev = [
  "botocore[crt]>=1.40,<2",
  "hypothesis>=6.138,<7",
  "httpx2>=2.9,<3",
  "mypy>=1.17,<3",
  "mutmut>=3.7,<4",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
recallops = "recallops.main:run"
recallops-eval = "recallops.evaluation:main"
recallops-migrate = "recallops.migrate:main"
recallops-reembed = "recallops.reembed:main"
recallops-outbox = "recallops.outbox:main"
recallops-db-verify = "recallops.db_verify:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recallops"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["recallops"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["recallops"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.mutmut]
source_paths = ["src/recallops/"]
only_mutate = [
  "src/recallops/evidence.py",
  "src/recallops/service.py",
  "src/recallops/store.py",
]
pytest_add_cli_args_test_selection = [
  "tests/test_evidence.py",
  "tests/test_retrieval.py",
  "tests/test_resilience.py",
  "tests/test_service.py",
  "tests/test_store.py",
]
mutate_only_covered_lines = true
