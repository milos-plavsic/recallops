name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest --cov=recallops --cov-report=term-missing --cov-fail-under=75
      - run: recallops-eval
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --local --format cyclonedx-json --output sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recallops-sbom
          path: sbom.cdx.json
          if-no-files-found: error
      - run: docker compose config --quiet
