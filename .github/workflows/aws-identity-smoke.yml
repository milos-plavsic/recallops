name: AWS identity smoke test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-identity-smoke
  cancel-in-progress: false

jobs:
  verify-identity:
    name: Verify bounded AWS identity
    runs-on: ubuntu-latest
    environment: recallops-production
    timeout-minutes: 5
    steps:
      - name: Acquire short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::158363272009:role/RecallOpsGitHubDeployment
          role-session-name: recallops-identity-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify assumed role
        shell: bash
        run: |
          set -euo pipefail
          identity_arn="$(aws sts get-caller-identity --query Arn --output text)"
          case "$identity_arn" in
            arn:aws:sts::*:assumed-role/RecallOpsGitHubDeployment/recallops-identity-*) ;;
            *)
              echo "Unexpected AWS caller identity" >&2
              exit 1
              ;;
          esac
          echo "AWS OIDC identity verified"
