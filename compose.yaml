services:
  cockroach:
    image: cockroachdb/cockroach:v26.2.1
    command: start-single-node --insecure --advertise-addr=cockroach
    ports:
      - "26257:26257"
      - "8081:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "node", "status", "--insecure"]
      interval: 5s
      timeout: 5s
      retries: 20
  create-database:
    image: cockroachdb/cockroach:v26.2.1
    depends_on:
      cockroach:
        condition: service_healthy
    command: [sql, --insecure, --host=cockroach, --execute=CREATE DATABASE IF NOT EXISTS recallops]
  migrate:
    build: .
    image: recallops:local
    depends_on:
      create-database:
        condition: service_completed_successfully
    environment:
      RECALLOPS_DATABASE_URL: postgresql://root@cockroach:26257/recallops?sslmode=disable
      RECALLOPS_MIGRATIONS_DIR: /app/migrations
    command: [recallops-migrate]
  api:
    build: .
    image: recallops:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      RECALLOPS_STORE: postgres
      RECALLOPS_DATABASE_URL: postgresql://root@cockroach:26257/recallops?sslmode=disable
    ports:
      - "8080:8080"
  seed:
    build: .
    image: recallops:local
    profiles: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      RECALLOPS_STORE: postgres
      RECALLOPS_DATABASE_URL: postgresql://root@cockroach:26257/recallops?sslmode=disable
    command: ["python", "-m", "recallops.demo"]
volumes:
  cockroach-data:
