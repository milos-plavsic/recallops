services:
  cockroach:
    image: cockroachdb/cockroach:v25.2.3
    command: start-single-node --insecure --advertise-addr=cockroach
    ports:
      - "26257:26257"
      - "8081:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "node", "status", "--insecure"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    image: cockroachdb/cockroach:v25.2.3
    depends_on:
      cockroach:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        cockroach sql --insecure --host=cockroach
        --execute='CREATE DATABASE IF NOT EXISTS recallops';
        for migration in /migrations/*.sql; do
          cockroach sql --insecure --host=cockroach --database=recallops --file="$${migration}";
        done
  api:
    build: .
    image: recallops:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      RECALLOPS_STORE: postgres
      RECALLOPS_DATABASE_URL: postgresql://root@cockroach:26257/recallops?sslmode=disable
    ports:
      - "8080:8080"
  seed:
    build: .
    image: recallops:local
    profiles: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      RECALLOPS_STORE: postgres
      RECALLOPS_DATABASE_URL: postgresql://root@cockroach:26257/recallops?sslmode=disable
    command: ["python", "-m", "recallops.demo"]
volumes:
  cockroach-data:
